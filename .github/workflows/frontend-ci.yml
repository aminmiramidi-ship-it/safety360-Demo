name: Safety360 Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "safety360-*"
  pull_request:
    branches:
      - main
      - "safety360-*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Reject browser bearer-token persistence
        run: |
          if grep -R --line-number --fixed-strings "safety360.access_token" src; then
            echo "Browser bearer-token persistence is not allowed. Use the HttpOnly session flow."
            exit 1
          fi

      - name: Verify browser session auth contract
        run: node scripts/session-auth-contract.mjs

      - name: Build frontend
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm run audit
