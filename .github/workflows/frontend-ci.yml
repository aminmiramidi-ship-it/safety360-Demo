name: Safety360 Frontend CI

on:
  push:
    branches:
      - main
      - safety360-frontend-foundation
      - safety360-webapp-i18n
  pull_request:
    branches:
      - main
      - safety360-frontend-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm run audit

      - name: Verify PWA assets
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon.svg
